[workspace]
resolver = "2"
members = [
    "contracts/qv-core",
    "examples/grant-vote",
]

[workspace.dependencies]
soroban-sdk = { version = "=22.0.7", features = [] }
# Pin ed25519-dalek to 2.x: soroban-env-host 22.x uses SigningKey::generate
# which changed signature in 3.0. The soroban-sdk pin above (=22.0.7) should
# prevent pulling soroban-env-host 22.1.x (which requires dalek 3.x), but we
# keep the explicit dalek pin as a belt-and-suspenders guard.
# Both pins can be removed when upgrading to soroban-sdk 28+.
ed25519-dalek = "=2.2.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
